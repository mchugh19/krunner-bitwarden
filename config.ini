[bitwarden]
# How to retrieve credentials:
#   dynamic — query API as you type (secure, recommended)
#   static  — pre-loads all items on startup (fast but stores secrets in memory)
credential_retrieval = dynamic

# URL of the bw serve API. Only change this if you use a custom port.
bitwarden_api = http://localhost:8087

# Full path to the bw executable. Leave empty to use bw from PATH.
bw_executable_path =

# Automatically start bw serve when the runner starts.
# allowed: true, false
auto_start_server = true

# How to unlock the vault after the server starts.
# allowed: none, prompt, password_file, password_env
#   none          — do not auto-unlock (use Unlock Bitwarden match manually)
#   prompt        — launch a terminal window asking for the master password
#   password_file — read the password from the file specified below
#   password_env  — read the password from the environment variable below
unlock_method = prompt

# Path to a file containing the master password (only used if unlock_method=password_file)
# IMPORTANT: restrict permissions — chmod 600 ~/.config/krunner-bitwarden/master-password.txt
unlock_password_file =

# Name of the environment variable containing the master password
# (only used if unlock_method=password_env)
unlock_password_env = BW_MASTER_PASS


# ── Password generator presets ────────────────────────────────────────────────
# Each [generator.<name>] section defines one preset.
# Password fields: type, length, uppercase, lowercase, numbers, special
# Passphrase fields: type, words, separator, capitalize, include_number

[generator.default]
type = password
length = 16
uppercase = true
lowercase = true
numbers = true
special = false

[generator.strong]
type = password
length = 24
uppercase = true
lowercase = true
numbers = true
special = true

[generator.passphrase]
type = passphrase
words = 3
separator = -
capitalize = false
include_number = false

[generator.pin]
type = password
length = 6
uppercase = false
lowercase = false
numbers = true
special = false
