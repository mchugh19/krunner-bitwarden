[bitwarden]
# Full path to the rbw executable. Leave empty to use rbw from PATH.
rbw_executable_path =

# rbw profile to use. Leave empty for rbw's default profile.
# When set, the runner passes it to every rbw call as RBW_PROFILE,
# which selects that profile's config, vault, and rbw-agent.
rbw_profile =

# Note: there are no unlock settings here, by design.
# Unlocking is done by rbw-agent through its configured pinentry program
# (set it with: rbw config set pinentry pinentry-qt). This plugin never
# handles your master password. Vault lock timing is rbw's own setting:
# rbw config set lock_timeout <seconds>


# -- Password generator presets ----------------------------------------------
# Each [generator.<name>] section defines one preset.
# Password fields: type, length, uppercase, lowercase, numbers, special
# Passphrase fields: type, words, separator, capitalize, include_number
#
# rbw's generator has fewer options than these presets describe:
#   passphrase presets use `rbw generate <words> --diceware`;
#     separator, capitalize, and include_number are ignored.
#   a preset with numbers only (no upper/lower/special) uses --only-numbers.
#   special = false uses --no-symbols; special = true includes symbols.
#   uppercase/lowercase toggles have no rbw equivalent and are ignored.

[generator.default]
type = password
length = 16
uppercase = true
lowercase = true
numbers = true
special = false

[generator.strong]
type = password
length = 24
uppercase = true
lowercase = true
numbers = true
special = true

[generator.passphrase]
type = passphrase
words = 3
separator = -
capitalize = false
include_number = false

[generator.pin]
type = password
length = 6
uppercase = false
lowercase = false
numbers = true
special = false
